<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Outside Time</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B0B0D" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Outside Time" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  html, body { margin:0; padding:0; background:#0B0B0D; height:100%; overflow:hidden; }
  #root { height:100%; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div id="root"></div>

<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const COLORS = {
  bg: "#0B0B0D",
  ink: "#EDEAE3",
  inkDim: "#8C897F",
  inkFaint: "#56534B",
  gold: "#C9A876",
  goldDim: "#6E5D3E",
  line: "#201F20",
};

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const STORAGE_KEY = "outside-time-posts";

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function daysBetween(a, b) {
  const ms = new Date(b) - new Date(a);
  return Math.round(ms / 86400000);
}

function formatRelative(dateStr) {
  const diff = daysBetween(todayStr(), dateStr);
  if (diff === 0) return "today";
  if (diff > 0) return `in ${diff} day${diff === 1 ? "" : "s"}`;
  const past = Math.abs(diff);
  return `${past} day${past === 1 ? "" : "s"} ago`;
}

function formatDayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const diff = daysBetween(todayStr(), dateStr);
  const label = `${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
  if (diff === 0) return `TODAY — ${label}`;
  if (diff > 0) return `${label.toUpperCase()} — IN ${diff} DAY${diff === 1 ? "" : "S"}`;
  return `${label.toUpperCase()} — ${Math.abs(diff)} DAY${Math.abs(diff) === 1 ? "" : "S"} AGO`;
}

function loadPosts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function savePosts(posts) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
  } catch (e) {
    console.error("could not save", e);
  }
}

function App() {
  const [posts, setPosts] = useState([]);
  const [composing, setComposing] = useState(false);
  const [draftText, setDraftText] = useState("");
  const [draftDate, setDraftDate] = useState(todayStr());
  const [activeYear] = useState(new Date().getFullYear());
  const todayMarkerRef = useRef(null);

  useEffect(() => {
    setPosts(loadPosts());
  }, []);

  useEffect(() => {
    setTimeout(() => {
      todayMarkerRef.current?.scrollIntoView({ block: "start" });
    }, 50);
  }, [posts.length === 0]);

  function submitPost() {
    if (!draftText.trim()) return;
    const newPost = {
      id: Date.now().toString(),
      text: draftText.trim(),
      date: draftDate,
      createdAt: new Date().toISOString(),
    };
    const next = [...posts, newPost].sort((a, b) => a.date.localeCompare(b.date));
    setPosts(next);
    savePosts(next);
    setDraftText("");
    setDraftDate(todayStr());
    setComposing(false);
  }

  const sorted = [...posts].sort((a, b) => a.date.localeCompare(b.date));
  const todayIdx = sorted.findIndex((p) => p.date >= todayStr());
  const currentMonth = new Date().getMonth();
  const monthsWithFuture = new Set(
    posts.filter((p) => p.date > todayStr()).map((p) => new Date(p.date + "T00:00:00").getMonth())
  );

  function jumpToMonth(monthIdx) {
    const target = sorted.find((p) => new Date(p.date + "T00:00:00").getMonth() === monthIdx);
    if (target) {
      document.getElementById(`post-${target.id}`)?.scrollIntoView({ block: "center", behavior: "smooth" });
    } else if (monthIdx === currentMonth) {
      todayMarkerRef.current?.scrollIntoView({ block: "start", behavior: "smooth" });
    }
  }

  return (
    <div style={{
      background: COLORS.bg, color: COLORS.ink, fontFamily: "'Inter', sans-serif",
      width: "100%", maxWidth: 480, margin: "0 auto", height: "100vh",
      display: "flex", flexDirection: "column", position: "relative", overflow: "hidden",
    }}>
      <div style={{
        padding: "20px 20px 12px", borderBottom: `1px solid ${COLORS.line}`,
        position: "sticky", top: 0, background: "rgba(11,11,13,0.94)",
        backdropFilter: "blur(10px)", zIndex: 5, flexShrink: 0,
      }}>
        <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 26, fontWeight: 500 }}>{activeYear}</div>
          <div style={{ fontSize: 11, color: COLORS.inkFaint }}>tap a month to jump</div>
        </div>
        <div style={{ display: "flex", gap: 6, marginTop: 12, overflowX: "auto", paddingBottom: 2 }}>
          {MONTH_NAMES.map((m, i) => {
            const isNow = i === currentMonth;
            const hasFuture = monthsWithFuture.has(i);
            return (
              <div key={m} onClick={() => jumpToMonth(i)} style={{
                flex: "0 0 auto", padding: "7px 13px", borderRadius: 20, fontSize: 13,
                cursor: "pointer", whiteSpace: "nowrap",
                color: isNow ? COLORS.bg : hasFuture ? COLORS.gold : COLORS.inkDim,
                background: isNow ? COLORS.ink : "transparent",
                border: `1px solid ${isNow ? COLORS.ink : hasFuture ? COLORS.goldDim : COLORS.line}`,
                fontWeight: isNow ? 500 : 400,
              }}>{m}</div>
            );
          })}
        </div>
      </div>

      <div style={{ flex: 1, overflowY: "auto", paddingBottom: 110 }}>
        {sorted.length === 0 && (
          <div style={{ padding: "60px 30px", textAlign: "center", color: COLORS.inkFaint, fontSize: 14, lineHeight: 1.6 }}>
            nothing written yet.<br/>write something for today, or for a date that hasn't arrived.
          </div>
        )}
        {sorted.map((post, i) => {
          const isToday = post.date === todayStr();
          const isFuture = post.date > todayStr();
          const showTodayMarkerHere = i === todayIdx;
          return (
            <div key={post.id}>
              {showTodayMarkerHere && (
                <div ref={todayMarkerRef} style={{ display: "flex", alignItems: "center", gap: 10, padding: "22px 20px 10px" }}>
                  <div style={{ width: 6, height: 6, borderRadius: "50%", background: COLORS.gold, boxShadow: "0 0 0 4px rgba(201,168,118,0.15)" }} />
                  <span style={{ fontSize: 12, letterSpacing: "0.03em", color: COLORS.gold }}>
                    TODAY — {MONTH_NAMES[new Date().getMonth()]} {new Date().getDate()}
                  </span>
                </div>
              )}
              {!isToday && (
                <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "22px 20px 10px" }}>
                  <div style={{ width: 6, height: 6, borderRadius: "50%", background: isFuture ? COLORS.gold : COLORS.inkFaint }} />
                  <span style={{ fontSize: 12, letterSpacing: "0.03em", color: isFuture ? COLORS.gold : COLORS.inkFaint }}>
                    {formatDayLabel(post.date)}
                  </span>
                </div>
              )}
              <div id={`post-${post.id}`} style={{
                padding: "14px 20px", display: "flex", gap: 12, borderBottom: `1px solid ${COLORS.line}`,
                background: isFuture ? "linear-gradient(180deg, rgba(201,168,118,0.05), transparent 60%)" : isToday ? "rgba(237,234,227,0.03)" : "transparent",
              }}>
                <div style={{
                  width: 40, height: 40, borderRadius: "50%", flexShrink: 0, marginTop: 2,
                  background: isFuture ? "linear-gradient(145deg, rgba(201,168,118,0.35), rgba(201,168,118,0.05))" : "linear-gradient(145deg,#2b2a28,#141414)",
                  outline: isFuture ? `1px solid ${COLORS.goldDim}` : isToday ? `1px solid ${COLORS.inkDim}` : "none",
                  outlineOffset: 2,
                }} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: COLORS.inkDim, marginBottom: 5 }}>
                    <span style={{ color: COLORS.ink, fontWeight: 600 }}>You</span>
                    <span style={{ color: COLORS.inkFaint }}>·</span>
                    <span style={{ color: isFuture ? COLORS.gold : COLORS.inkDim, fontWeight: isFuture ? 500 : 400 }}>{formatRelative(post.date)}</span>
                  </div>
                  <div style={{ fontSize: 15, lineHeight: 1.45, color: isFuture ? "#E8DCC4" : COLORS.ink }}>{post.text}</div>
                  {isFuture && <div style={{ marginTop: 10, fontSize: 11, letterSpacing: "0.04em", color: COLORS.goldDim }}>not yet arrived</div>}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {!composing && (
        <div onClick={() => setComposing(true)} style={{
          position: "absolute", bottom: 26, right: 22, width: 54, height: 54, borderRadius: "50%",
          background: COLORS.ink, color: COLORS.bg, display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 26, cursor: "pointer", boxShadow: "0 8px 24px rgba(0,0,0,0.5)",
        }}>+</div>
      )}

      {composing && (
        <div onClick={() => setComposing(false)} style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.6)", display: "flex", alignItems: "flex-end", zIndex: 10 }}>
          <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", background: "#141416", borderTop: `1px solid ${COLORS.line}`, borderRadius: "16px 16px 0 0", padding: 20 }}>
            <div style={{ fontSize: 13, color: COLORS.inkDim, marginBottom: 10 }}>writing for</div>
            <input type="date" value={draftDate} onChange={(e) => setDraftDate(e.target.value)} style={{
              background: "transparent", border: `1px solid ${COLORS.line}`, borderRadius: 8, padding: "8px 12px",
              color: draftDate > todayStr() ? COLORS.gold : COLORS.ink, fontSize: 14, marginBottom: 16, width: "100%",
              fontFamily: "'Inter', sans-serif",
            }} />
            <textarea autoFocus value={draftText} onChange={(e) => setDraftText(e.target.value)}
              placeholder={draftDate > todayStr() ? "what does this day look like..." : "what's happening..."}
              style={{ width: "100%", minHeight: 100, background: "transparent", border: "none", color: COLORS.ink, fontSize: 16, fontFamily: "'Inter', sans-serif", resize: "none" }} />
            <div style={{ display: "flex", justifyContent: "flex-end", gap: 10, marginTop: 10 }}>
              <button onClick={() => setComposing(false)} style={{ background: "transparent", border: "none", color: COLORS.inkDim, fontSize: 14, padding: "10px 16px", cursor: "pointer" }}>Cancel</button>
              <button onClick={submitPost} style={{ background: COLORS.ink, border: "none", color: COLORS.bg, fontSize: 14, fontWeight: 600, padding: "10px 20px", borderRadius: 20, cursor: "pointer" }}>Post</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
